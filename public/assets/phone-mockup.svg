<svg width="300" height="600" viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone outer shell -->
  <rect x="10" y="0" width="280" height="600" rx="40" ry="40" fill="#111"/>
  <!-- Screen area -->
  <rect x="30" y="50" width="240" height="500" rx="20" ry="20" fill="#222"/>
  <!-- Header with status icons -->
  <g fill="#aaa" font-family="Arial,Helvetica,sans-serif" font-size="14">
    <text x="150" y="30" text-anchor="middle">12:45</text>
    <circle cx="260" cy="30" r="6" fill="#0f0"/>
  </g>
  <!-- CTA buttons inside the mock app -->
  <g fill="#fff" font-family="Arial,Helvetica,sans-serif">
    <rect x="50" y="200" width="200" height="50" rx="8" ry="8" fill="#0066ff"/>
    <text x="150" y="233" font-size="18" text-anchor="middle" fill="#fff">Book Demo</text>
    <rect x="50" y="280" width="200" height="50" rx="8" ry="8" fill="#00cc66"/>
    <text x="150" y="313" font-size="18" text-anchor="middle" fill="#fff">Explore Home</text>
    <rect x="50" y="360" width="200" height="50" rx="8" ry="8" fill="#ffaa00"/>
    <text x="150" y="393" font-size="18" text-anchor="middle" fill="#fff">Live Demo</text>
  </g>
</svg>
